name: 构建一维输入法

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'PROGRESS.md', 'update/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  WEASEL_REPO: https://github.com/rime/weasel.git
  WEASEL_SHA: d73f6295e8252ed2f7b9c12bae32e9001b1afdaa
  VERSION_MAJOR: '0'
  VERSION_MINOR: '1'
  VERSION_PATCH: '0'

jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\weasel\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    steps:
      - name: 检出一维输入法
        uses: actions/checkout@v5

      - name: 获取小狼毫源码（固定版本）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone $env:WEASEL_REPO weasel
          cd weasel
          git checkout $env:WEASEL_SHA
          git submodule update --init --recursive
          git fetch --tags

      - name: 改名为一维输入法
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/rebrand.py weasel
          Copy-Item assets\yiwei.ico weasel\resource\weasel.ico -Force
          Copy-Item assets\installer-*.bmp weasel\resource\ -Force
          Copy-Item assets\zh.ico weasel\resource\zh.ico -Force
          Copy-Item assets\en.ico weasel\resource\en.ico -Force
          Copy-Item weasel\env.vs2022.bat weasel\env.bat

      - name: 缓存 Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-x86x64

      - name: 安装 Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        working-directory: weasel
        run: |
          ./install_boost.bat
          ./build.bat boost

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: 缓存 WinSparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled

      - name: 编译 WinSparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\weasel\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln

      - name: 放置 WinSparkle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\weasel\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\weasel\lib64\
          copy .\winsparkle\Release\WinSparkle.dll .\weasel\output\Win32\
          copy .\winsparkle\Release\WinSparkle.lib .\weasel\lib\

      - name: 获取 RIME 引擎
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: weasel
        run: |
          $ErrorActionPreference = 'Stop'
          # 带令牌访问 GitHub API，避免共享 IP 触发 403 限流；失败重试 3 次
          $authorization = $env:GH_TOKEN
          for ($i = 1; $i -le 3; $i++) {
            .\get-rime.ps1 -use dev
            if (Test-Path .\include\rime_api.h) { break }
            Write-Host "get-rime 第 $i 次失败，30 秒后重试"; Start-Sleep 30
          }
          if (-not (Test-Path .\include\rime_api.h)) { throw "获取 RIME 引擎失败" }

      - name: 准备基础数据
        shell: pwsh
        working-directory: weasel
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: 雾凇拼音、配色与扩展
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/iDvel/rime-ice/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -eq 'full.zip' }
          Invoke-WebRequest $asset.browser_download_url -OutFile rime-ice-full.zip
          $hash = (Get-FileHash rime-ice-full.zip -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest -and ("sha256:" + $hash) -ne $asset.digest) { throw "rime-ice checksum mismatch" }
          Write-Host "rime-ice $($rel.tag_name) $hash"
          python scripts/customize_data.py weasel rime-ice-full.zip

      - name: 编译一维助手
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build helper\YiweiHelper.csproj -c Release -o helper-out -p:Version=${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}.${{ github.run_number }}
          Copy-Item helper-out\YiweiHelper.exe weasel\output\ -Force
          if (Test-Path helper-out\YiweiHelper.exe.config) { Copy-Item helper-out\YiweiHelper.exe.config weasel\output\ -Force }
          New-Item -ItemType Directory -Force weasel\output\helperlibs | Out-Null
          Get-ChildItem helper-out -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination weasel\output\helperlibs\ -Force
          Get-ChildItem weasel\output\helperlibs

      - name: 编译输入法并打包
        shell: pwsh
        working-directory: weasel
        env:
          RELEASE_BUILD: '1'
          WEASEL_BUILD: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat installer
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Get-ChildItem output\archives

      - name: 收集编译日志
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          Get-ChildItem weasel -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination build-logs
          Get-ChildItem weasel\output -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue | Select-Object FullName | Out-File build-logs\output-files.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build-logs
          if-no-files-found: ignore
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: yiwei-ime-installer
          if-no-files-found: error
          path: weasel\output\archives\yiwei-ime*.exe


  smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: yiwei-ime-installer
          path: dist
      - name: 静默安装并自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist -Filter 'yiwei-ime*.exe' | Select-Object -First 1
          Write-Host "installer: $($exe.Name)"
          # 安装界面截图：交互模式打开欢迎页，截屏后关掉，再静默安装
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            New-Item -ItemType Directory -Force screens | Out-Null
            $ui = Start-Process $exe.FullName -PassThru; Start-Sleep 10
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screens\installer-welcome.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          } catch { Write-Host "安装界面截图失败：$_" }
          $p = Start-Process $exe.FullName -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "安装超时（可能弹出了对话框）" }
          Write-Host "installer exit code $($p.ExitCode)"
          $root = $null
          foreach ($k in 'HKLM:\SOFTWARE\Yiwei\YiweiIME','HKLM:\SOFTWARE\WOW6432Node\Yiwei\YiweiIME') {
            if (Test-Path $k) { $v = (Get-ItemProperty $k).YiweiRoot; if ($v) { $root = $v } }
          }
          if (-not $root) { throw "注册表里没有 YiweiRoot" }
          Write-Host "YiweiRoot = $root"
          foreach ($f in 'YiweiServer.exe','YiweiDeployer.exe','YiweiSetup.exe','YiweiHelper.exe','rime.dll','data\rime_ice.schema.yaml','data\lua\yiwei_stats.lua') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "缺少文件 $f" }
          }
          # 语法模型依赖 librime-octagram（librime 官方发行包静态链接了 lua / octagram / predict）
          $rimeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $root 'rime.dll')))
          if (-not $rimeText.Contains('octagram')) { throw "rime.dll 不含 librime-octagram 插件，语法模型将不可用" }
          if (-not $rimeText.Contains('lua_processor')) { Write-Host "警告：rime.dll 里没找到 librime-lua" }
          $sys = "$env:WINDIR\System32"
          if (-not ((Test-Path "$sys\yiwei.dll") -or (Test-Path "$sys\yiweix64.dll"))) { Get-ChildItem $sys -Filter 'yiwei*' ; throw "系统目录里没有 yiwei 输入法模块" }
          $tip = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{54C92C2A-5FE9-43A0-A9EC-D05B42C996D4}'
          if (-not (Test-Path $tip)) { throw "TSF 输入法没有注册：$tip" }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}') { throw "注册了小狼毫的 CLSID，改名不彻底" }
          # 部署词库
          $d = Start-Process (Join-Path $root 'YiweiDeployer.exe') -ArgumentList '/deploy' -PassThru
          if (-not $d.WaitForExit(600000)) { $d.Kill(); throw "部署超时" }
          $user = Join-Path $env:APPDATA 'YiweiIME'
          Write-Host "user dir: $user"
          Get-ChildItem (Join-Path $user 'build') -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (-not (Test-Path (Join-Path $user 'build\rime_ice.prism.bin'))) { throw "雾凇拼音没有部署成功" }
          # 输入法服务与助手能否启动
          Start-Process (Join-Path $root 'YiweiServer.exe')
          Start-Process (Join-Path $root 'YiweiHelper.exe') -ArgumentList '/background'
          Start-Sleep 8
          if (-not (Get-Process YiweiServer -ErrorAction SilentlyContinue)) { throw "YiweiServer 没有启动" }
          if (-not (Get-Process YiweiHelper -ErrorAction SilentlyContinue)) { throw "YiweiHelper 启动后退出了" }
          Write-Host "自检通过"
      - name: 界面截图
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screens | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screens\$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          $root = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Yiwei\YiweiIME' -ErrorAction SilentlyContinue).YiweiRoot
          if (-not $root) { $root = (Get-ItemProperty 'HKLM:\SOFTWARE\Yiwei\YiweiIME').YiweiRoot }
          $h = Join-Path $root 'YiweiHelper.exe'
          foreach ($pg in '常规','外观','快捷键','常用语','AI','统计','关于') {
            Start-Process $h -ArgumentList '/settings', $pg; Start-Sleep 5; Shot "settings-$pg"
          }
          Get-Process YiweiHelper -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process $h -ArgumentList '/wizard'; Start-Sleep 6; Shot 'wizard-1'
          Add-Type -AssemblyName Microsoft.VisualBasic
          for ($i = 2; $i -le 7; $i++) { [System.Windows.Forms.SendKeys]::SendWait('{ENTER}'); Start-Sleep 2; Shot "wizard-$i" }
          Get-ChildItem "$env:APPDATA\YiweiIME" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination screens
          Get-ChildItem "$env:LOCALAPPDATA" -Filter 'Yiwei*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem $_.FullName -Filter *.log -Recurse | Copy-Item -Destination screens }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: 收集自检日志
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-logs | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter 'rime*' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName smoke-logs -Recurse -Force }
          Copy-Item "$env:APPDATA\YiweiIME\*.yaml" smoke-logs -ErrorAction SilentlyContinue
          Get-ChildItem smoke-logs -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: smoke-logs
          if-no-files-found: ignore

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    concurrency: { group: release-nightly, cancel-in-progress: false }  # one publish at a time
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: yiwei-ime-installer
          path: dist
      - name: 发布测试版
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          f=$(ls dist/yiwei-ime*.exe | head -1)
          # move the tag and refresh the release in place (deleting and re-creating races with GitHub and can leave no release at all)
          git tag -f nightly "$GITHUB_SHA" && git push -f origin "refs/tags/nightly"
          if gh release view nightly >/dev/null 2>&1; then
            for a in $(gh release view nightly --json assets --jq '.assets[].name'); do gh release delete-asset nightly "$a" -y; done
            gh release upload nightly "$f" --clobber
            gh release edit nightly --prerelease --latest=false --title "一维输入法 测试版" --notes "一维输入法 Windows 测试版（自动构建 #${{ github.run_number }}，提交 ${GITHUB_SHA::7}）。下载 $(basename "$f")，双击安装。支持 Windows 10/11。"
          else
            gh release create nightly "$f" --verify-tag --prerelease --latest=false --title "一维输入法 测试版" --notes "一维输入法 Windows 测试版（自动构建 #${{ github.run_number }}，提交 ${GITHUB_SHA::7}）。下载 $(basename "$f")，双击安装。支持 Windows 10/11。"
          fi
      - name: 发布正式版
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls dist/yiwei-ime*.exe | head -1)
          gh release create "$GITHUB_REF_NAME" "$f" --title "一维输入法 $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" "$f" --clobber
      - name: 更新自动更新清单
        run: |
          set -e
          f=$(ls dist/yiwei-ime*.exe | head -1); name=$(basename "$f"); size=$(stat -c %s "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
          ver=$(echo "$name" | sed -E 's/yiwei-ime-([0-9.]+)-installer.exe/\1/')
          tag=$([ "${GITHUB_REF_TYPE}" = tag ] && echo "$GITHUB_REF_NAME" || echo nightly)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}"
          mkdir -p update
          cat > update/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>一维输入法 更新</title>
              <link>https://github.com/${GITHUB_REPOSITORY}</link>
              <item>
                <title>一维输入法 ${ver}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:releaseNotesLink>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}</sparkle:releaseNotesLink>
                <enclosure url="${url}" sparkle:version="${ver}" sparkle:shortVersionString="${ver}" sparkle:os="windows" length="${size}" sha256="${sha}" type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          sed -i 's/^          //' update/appcast.xml
          cp update/appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved (or another run wrote the manifest) while this run built: start from the newest main each try
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/appcast.xml update/appcast.xml
            git add update/appcast.xml
            git diff --cached --quiet && exit 0
            git commit -qm "更新自动更新清单 ${ver} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  screens:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 把截图写进 ci-shots 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir s && cd s
          gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n screens -D . || exit 0
          git init -q -b ci-shots && git config user.name ci && git config user.email ci@users.noreply.github.com
          echo "run $GITHUB_RUN_ID $GITHUB_SHA" > README.txt; ls > index.txt
          git add -A && git commit -qm "screens $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" ci-shots

  report:
    needs: [build, smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 把失败日志写进 ci-logs 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir logs && cd logs
          for id in $(gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            for t in 1 2 3 4 5 6; do curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o job-$id.log; [ -s job-$id.log ] && ! grep -q '"message"' job-$id.log && break; sleep 20; done
            grep -n -iE "error|fail|throw|exception|缺少|没有|超时" job-$id.log | tail -200 > job-$id.errors.txt || true
          done
          gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs --jq '.jobs[] | {name, conclusion, steps: [.steps[] | select(.conclusion=="failure") | .name]}' > summary.json
          sleep 20
          gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -D artifacts -n build-logs || true
          gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -D artifacts -n smoke-logs || true
          for f in $(find artifacts -name '*.log' 2>/dev/null); do grep -n -E " error |error [A-Z]+[0-9]+|: error|Error:|MSB[0-9]+" "$f" | grep -v warning | head -100 > "$(basename $f).errors.txt" || true; done
          git init -q -b ci-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          echo "run $GITHUB_RUN_ID $GITHUB_SHA" > README.txt
          git add -A && git commit -qm "logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" ci-logs
